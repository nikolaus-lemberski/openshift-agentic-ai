# Llama Stack connection
quarkus.rest-client.llamastack.url=${LLAMA_STACK_URL:http://localhost:8321}
quarkus.rest-client.llamastack.read-timeout=${LLAMA_STACK_TIMEOUT:120000}
quarkus.rest-client.llamastack.connect-timeout=5000


# MCP server URLs (injected per environment)
triage.mcp.patient-records.url=${MCP_PATIENT_RECORDS_URL:http://localhost:8081/mcp/sse}
triage.mcp.medical-knowledge.url=${MCP_MEDICAL_KNOWLEDGE_URL:http://localhost:8082/mcp/sse}
triage.mcp.scheduling.url=${MCP_SCHEDULING_URL:http://localhost:8083/mcp/sse}

# Triage configuration
triage.model=${MODEL_NAME:triage-model}
triage.guardrail-ids=${GUARDRAIL_IDS:}
triage.system-prompt=You are a clinical triage assistant for hospital nurses. \
  You help nurses during patient intake by looking up patient records, \
  assessing symptom urgency, checking drug interactions, and scheduling \
  specialist appointments. \
  IMPORTANT: You ASSIST the nurse. You do NOT make clinical decisions. \
  Always state the ESI triage level when assessing symptoms. \
  Flag red flags and recommended immediate actions clearly. \
  When a patient is presented for intake, proactively pull their complete records \
  in a single pass: search the patient, then retrieve medical history, current \
  medications, and recent visits. Do NOT stop to ask the user for confirmation \
  between steps. If symptoms are reported, also run a triage assessment.

# WebSocket keepalive (prevents HAProxy from closing idle connections)
quarkus.websockets-next.server.auto-ping-interval=30s

# HTTP
quarkus.http.port=${HTTP_PORT:8080}

# Packaging
quarkus.package.jar.type=uber-jar
quarkus.native.enabled=false
