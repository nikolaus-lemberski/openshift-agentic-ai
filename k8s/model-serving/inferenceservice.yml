apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: qwen35-9b
  namespace: triage-assistant
  labels:
    opendatahub.io/dashboard: "true"
    opendatahub.io/genai-asset: "true"
  annotations:
    modelFormat: vLLM
    opendatahub.io/hardware-profile-name: gpu-profile
    opendatahub.io/hardware-profile-namespace: redhat-ods-applications
    opendatahub.io/model-type: generative
    openshift.io/display-name: "Qwen 3.5 9B FP8"
    security.opendatahub.io/enable-auth: "false"
    serving.kserve.io/deploymentMode: Standard
    serving.kserve.io/disableRouteCreation: "true"
spec:
  predictor:
    serviceAccountName: model-serving-sa
    automountServiceAccountToken: false
    maxReplicas: 1
    minReplicas: 1
    model:
      modelFormat:
        name: vLLM
      name: ""
      runtime: qwen35-9b
      storageUri: s3://models/qwen3.5-9b
      resources:
        requests:
          cpu: "4"
          memory: 24Gi
          nvidia.com/gpu: "1"
        limits:
          cpu: "8"
          memory: 32Gi
          nvidia.com/gpu: "1"
      args:
        - --dtype=auto
        - --max-model-len=16384
        - --gpu-memory-utilization=0.95
        - --language-model-only
        - --enable-auto-tool-choice
        - --tool-call-parser=qwen3_xml
        - --trust-remote-code
