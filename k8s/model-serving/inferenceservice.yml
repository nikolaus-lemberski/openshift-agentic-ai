apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: qwen36-27b
  namespace: triage-assistant
  labels:
    opendatahub.io/dashboard: "true"
    opendatahub.io/genai-asset: "true"
  annotations:
    modelFormat: vLLM
    opendatahub.io/hardware-profile-name: gpu-profile
    opendatahub.io/hardware-profile-namespace: redhat-ods-applications
    opendatahub.io/model-type: generative
    openshift.io/display-name: "Qwen 3.6 27B (FP8)"
    security.opendatahub.io/enable-auth: "false"
    serving.kserve.io/deploymentMode: Standard
    serving.kserve.io/disableRouteCreation: "true"
spec:
  predictor:
    serviceAccountName: model-serving-sa
    automountServiceAccountToken: false
    maxReplicas: 1
    minReplicas: 1
    model:
      modelFormat:
        name: vLLM
      name: ""
      runtime: qwen36-27b
      storageUri: s3://models/qwen3.6-27b-fp8
      resources:
        requests:
          cpu: "8"
          memory: 64Gi
          nvidia.com/gpu: "4"
        limits:
          cpu: "16"
          memory: 96Gi
          nvidia.com/gpu: "4"
      args:
        - --dtype=auto
        - --max-model-len=32768
        - --gpu-memory-utilization=0.95
        - --language-model-only
        - --enable-auto-tool-choice
        - --tool-call-parser=hermes
        - --chat-template-kwargs={"enable_thinking":false}
