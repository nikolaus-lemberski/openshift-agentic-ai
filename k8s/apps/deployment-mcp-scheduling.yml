apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-scheduling
  namespace: triage-assistant
  labels:
    app: mcp-scheduling
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-scheduling
  template:
    metadata:
      labels:
        app: mcp-scheduling
    spec:
      containers:
        - name: mcp-scheduling
          image: quay.io/nlembers/agentic-ai-webinar-2026-mcp-scheduling:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              protocol: TCP
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
