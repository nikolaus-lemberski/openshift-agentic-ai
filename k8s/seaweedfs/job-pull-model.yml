apiVersion: v1
kind: ConfigMap
metadata:
  name: pull-model-script
  namespace: triage-assistant
data:
  pull_model.py: |
    import os
    import boto3
    from pathlib import Path
    from huggingface_hub import snapshot_download

    MODEL_REPO = os.environ.get("MODEL_REPO", "RedHatAI/Qwen3.5-9B-FP8-dynamic")
    S3_ENDPOINT = os.environ.get("S3_ENDPOINT", "http://seaweedfs:8333")
    S3_ACCESS_KEY = os.environ.get("AWS_ACCESS_KEY_ID", "admin")
    S3_SECRET_KEY = os.environ.get("AWS_SECRET_ACCESS_KEY", "admin123")
    BUCKET = os.environ.get("BUCKET", "models")
    BUCKET_PATH = os.environ.get("BUCKET_PATH", "qwen3.5-9b")
    LOCAL_DIR = "/tmp/model"

    print(f"=== Model Pull Job ===")
    print(f"Model:       {MODEL_REPO}")
    print(f"S3 Endpoint: {S3_ENDPOINT}")
    print(f"Destination: s3://{BUCKET}/{BUCKET_PATH}/")
    print()

    print("[1/3] Downloading model from HuggingFace...")
    snapshot_download(
        repo_id=MODEL_REPO,
        local_dir=LOCAL_DIR,
        local_dir_use_symlinks=False,
    )
    print("Download complete.")

    print("[2/3] Connecting to S3 (SeaweedFS)...")
    s3 = boto3.client(
        "s3",
        endpoint_url=S3_ENDPOINT,
        aws_access_key_id=S3_ACCESS_KEY,
        aws_secret_access_key=S3_SECRET_KEY,
        region_name="us-east-1",
    )

    try:
        s3.head_bucket(Bucket=BUCKET)
    except Exception:
        print(f"Creating bucket '{BUCKET}'...")
        s3.create_bucket(Bucket=BUCKET)

    print("[3/3] Uploading to SeaweedFS...")
    local_path = Path(LOCAL_DIR)
    files = [f for f in local_path.rglob("*") if f.is_file()]
    total = len(files)

    for i, file_path in enumerate(files, 1):
        relative = file_path.relative_to(local_path)
        key = f"{BUCKET_PATH}/{relative}"
        size_mb = file_path.stat().st_size / (1024 * 1024)
        print(f"  [{i}/{total}] {relative} ({size_mb:.1f} MB)")
        s3.upload_file(str(file_path), BUCKET, key)

    print()
    print("[3b/3] Patching tokenizer_config.json for vLLM compatibility...")
    import json
    tokenizer_key = f"{BUCKET_PATH}/tokenizer_config.json"
    obj = s3.get_object(Bucket=BUCKET, Key=tokenizer_key)
    tokenizer_config = json.loads(obj["Body"].read())
    if tokenizer_config.get("tokenizer_class") == "TokenizersBackend":
        tokenizer_config["tokenizer_class"] = "PreTrainedTokenizerFast"
        tokenizer_config.pop("backend", None)
        s3.put_object(
            Bucket=BUCKET,
            Key=tokenizer_key,
            Body=json.dumps(tokenizer_config, indent=2),
            ContentType="application/json",
        )
        print("  Patched: tokenizer_class TokenizersBackend -> PreTrainedTokenizerFast")
    else:
        print(f"  No patch needed (tokenizer_class={tokenizer_config.get('tokenizer_class')})")

    print()
    print(f"=== Done! Model available at s3://{BUCKET}/{BUCKET_PATH}/ ===")
---
apiVersion: batch/v1
kind: Job
metadata:
  name: pull-qwen35-9b
  namespace: triage-assistant
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: pull-model
    spec:
      restartPolicy: OnFailure
      containers:
        - name: pull-model
          image: registry.access.redhat.com/ubi9/python-311:latest
          command:
            - bash
            - -c
            - |
              pip install --quiet huggingface_hub boto3 && \
              python /scripts/pull_model.py
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: seaweedfs-credentials
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: seaweedfs-credentials
                  key: AWS_SECRET_ACCESS_KEY
            - name: S3_ENDPOINT
              value: http://seaweedfs:8333
            - name: MODEL_REPO
              value: RedHatAI/Qwen3.5-9B-FP8-dynamic
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: token
                  optional: true
          volumeMounts:
            - name: script
              mountPath: /scripts
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: "1"
              memory: 4Gi
            limits:
              cpu: "4"
              memory: 8Gi
      volumes:
        - name: script
          configMap:
            name: pull-model-script
        - name: tmp
          emptyDir:
            sizeLimit: 25Gi
