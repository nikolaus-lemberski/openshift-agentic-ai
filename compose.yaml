services:
  ogx-server:
    build: ./ogx_configs
    ports:
      - "8321:8321"
    extra_hosts:
      - "host.containers.internal:host-gateway"
    environment:
      RUN_CONFIG_PATH: /app/config.yaml
      OLLAMA_URL: ${OLLAMA_URL:-http://host.containers.internal:11434}
      MCP_PATIENT_RECORDS_URL: http://mcp-patient-records:8080/mcp/sse
      MCP_MEDICAL_KNOWLEDGE_URL: http://mcp-medical-knowledge:8080/mcp/sse
      MCP_SCHEDULING_URL: http://mcp-scheduling:8080/mcp/sse
      LLAMA_STACK_LOGGING: agents=debug,inference=debug
    depends_on:
      - mcp-patient-records
      - mcp-medical-knowledge
      - mcp-scheduling

  triage-assistant:
    build: ./triage-assistant
    ports:
      - "8080:8080"
    environment:
      LLAMA_STACK_URL: http://ogx-server:8321
      MODEL_NAME: local-ollama/${OLLAMA_MODEL:-qwen3.5:9b}
      MCP_PATIENT_RECORDS_URL: http://mcp-patient-records:8080/mcp/sse
      MCP_MEDICAL_KNOWLEDGE_URL: http://mcp-medical-knowledge:8080/mcp/sse
      MCP_SCHEDULING_URL: http://mcp-scheduling:8080/mcp/sse
    depends_on:
      - ogx-server

  mcp-patient-records:
    build: ./mcp-patient-records
    ports:
      - "8081:8080"

  mcp-medical-knowledge:
    build: ./mcp-medical-knowledge
    ports:
      - "8082:8080"

  mcp-scheduling:
    build: ./mcp-scheduling
    ports:
      - "8083:8080"
